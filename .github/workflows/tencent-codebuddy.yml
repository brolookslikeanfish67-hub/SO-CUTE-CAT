name: Tencent CodeBuddy Local Fixer

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  tencent-test-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. UPGRADE ALL PYTHON DEPENDENCIES & PACKAGE FILES
      - name: Run Tencent Dependency Update Engine
        run: |
          pip install --upgrade pip
          if [ -f setup.py ]; then
            pip install pur
            pur -r requirements.txt || true
          fi

      # 2. RUN AUTOMATED PYTHON FORMATTING & CODE FIXES
      - name: Run Tencent Python Fix Engine
        run: |
          pip install ruff
          ruff format . --check || ruff format .
          ruff check . --fix || true

      # 3. RUN AUTOMATED C/C++ CODE FIXES
      - name: Run Tencent C Fix Engine
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find . -name "*.c" -o -name "*.h" -o -name "*.cpp" | xargs clang-format -i || true

      # 4. GENERATE THE AUTOMATED PULL REQUEST UNDER TENCENT PROFILE
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # CRUCIAL FIX: [skip ci] and ***NO_CI*** prevents the original Kitty CI from blowing up
          commit-message: "chore: Tencent CodeBuddy automated system & style updates [skip ci] ***NO_CI***"
          committer: Tencent-CodeBuddy-Bot <codebuddy-bot@tencent.com>
          author: Tencent-CodeBuddy-Bot <codebuddy-bot@tencent.com>
          branch: tencent-bot-updates
          title: " Tencent CodeBuddy: System Optimization & Code Updates"
          body: |
            ###  Tencent CodeBuddy Automation Summary
            The automated pipeline has analyzed your codebase and completed the following steps:
            - **Dependency Check**: Verified and upgraded all external package definitions.
            - **Code Style Fixes**: Successfully applied Python formatting (`ruff`) and C formatting (`clang-format`).
            
            Review these adjustments and click **Merge** to accept the contributions.
          base: master
